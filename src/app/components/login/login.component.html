<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="back-link">← Home</a>
    <div class="auth-brand">
      <span class="brand-icon">◆</span>
      <h1>{{ appName }}</h1>
    </div>
    <p class="auth-sub">Sign in to your service desk workspace</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="you@company.com" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </label>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-footer">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
